[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[project]
name = "mppt"
version = "0.8.0"
description = "A Modern Python Package Template"
authors = [{ name = "Xiangzhuang Shen", email = "datahonor@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"


classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">= 3.12"
dependencies = []

[dependency-groups]
dev = [
    "hypothesis>=6.163.0",
    "ipython>=9.15.0",
    "prek>=0.4.11",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-sugar>=1.1.1",
    "ruff>=0.16.0",
    "ty>=0.0.65",
]
docs = [
    "zensical>=0.0.51",
]

[project.urls]
"Homepage" = "https://shenxiangzhuang.github.io/mppt"
"Bug Tracker" = "https://shenxiangzhuang.github.io/mppt/issues"
"Documentation" = "https://shenxiangzhuang.github.io/mppt"
"Source Code" = "https://github.com/shenxiangzhuang/mppt"
"Release Notes" = "https://shenxiangzhuang.github.io/mppt/changelog/"

[tool.ty.src]
include = ["src", "tests"]

# Ruff configuration: https://docs.astral.sh/ruff/configuration/#configuring-ruff
[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 120
indent-width = 4

# Assume Python 3.12
target-version = "py312"

[tool.ruff.lint]
select = [
    'F',  # Pyflakes
    'E',  # pycodestyle (Error)
    'I',  # isort
    'D',  # pydocstyle
    'UP', # pyupgrade
]
pydocstyle = { convention = "google" }

[tool.ruff.lint.per-file-ignores]
'docs/*' = ["D"]
'tests/*' = ["D"]


# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []


[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
